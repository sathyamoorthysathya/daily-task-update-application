# Security headers for every response of the web client (included in each location, because
# nginx does not inherit add_header directives into locations that define their own).
#
# CSP: scripts only from this site and Google Identity Services; no inline scripts, plugins,
# framing or form posts elsewhere. Inline style attributes are allowed (used by React and GIS).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://*.googleusercontent.com; font-src 'self'; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Allow Google sign-in pop-ups to communicate with this page.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
# Browsers ignore HSTS over plain HTTP; it takes effect behind HTTPS (TLS terminated in front).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
