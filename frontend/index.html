<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Task Update</title>
    <!--
      Start-up screen, shown while the app's code downloads (slow networks would otherwise see a
      blank page). Plain CSS only: React replaces the contents of #root when it starts.
    -->
    <style>
      .boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        min-height: 100vh;
        margin: 0;
        background: #f3f5f8;
        color: #5c6678;
        font-family:
          'Segoe UI Variable',
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
      }
      .boot-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #eef1ff;
        border-top-color: #3b4fd8;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      .boot-title {
        color: #141821;
        font-weight: 700;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        .boot {
          background: #0e1116;
          color: #a3adbf;
        }
        .boot-spinner {
          border-color: #222a44;
          border-top-color: #8ea2ff;
        }
        .boot-title {
          color: #eef1f6;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <span class="boot-spinner" aria-hidden="true"></span>
        <span class="boot-title">Daily Task Update</span>
        <span>Loading…</span>
      </div>
    </div>
    <noscript
      >Daily Task Update needs JavaScript to run. Please enable it in your browser.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
