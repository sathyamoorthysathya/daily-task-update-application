    <rect x="536" y="70" width="84" height="24" rx="12" fill="#ddf3e4"/>
    <circle cx="551" cy="82" r="3.5" fill="#17703a"/>
    <rect x="560" y="78" width="46" height="8" rx="4" fill="#17703a"/>

    <rect x="536" y="131" width="84" height="24" rx="12" fill="#ddf3e4"/>
    <circle cx="551" cy="143" r="3.5" fill="#17703a"/>
    <rect x="560" y="139" width="46" height="8" rx="4" fill="#17703a"/>

    <rect x="536" y="192" width="84" height="24" rx="12" fill="#dce8ff"/>
    <circle cx="551" cy="204" r="3.5" fill="#1f4fd8"/>
    <rect x="560" y="200" width="50" height="8" rx="4" fill="#1f4fd8"/>

    <rect x="536" y="253" width="84" height="24" rx="12" fill="#ddf3e4"/>
    <circle cx="551" cy="265" r="3.5" fill="#17703a"/>
    <rect x="560" y="261" width="46" height="8" rx="4" fill="#17703a"/>

    <rect x="536" y="314" width="84" height="24" rx="12" fill="#fff1cc"/>
    <circle cx="551" cy="326" r="3.5" fill="#8a5a00"/>
    <rect x="560" y="322" width="40" height="8" rx="4" fill="#8a5a00"/>

    <rect x="536" y="375" width="84" height="24" rx="12" fill="#edeff3"/>
    <circle cx="551" cy="387" r="3.5" fill="#4a5262"/>
    <rect x="560" y="383" width="34" height="8" rx="4" fill="#4a5262"/>
  </g>
