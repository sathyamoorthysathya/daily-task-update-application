<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520">
  <!-- A daily task sheet, slightly turned. Used as a background drawing on the sign-in pages. -->
  <g transform="translate(10 64) rotate(-5)">
    <rect x="8" y="12" width="640" height="420" rx="14" fill="#0b1330" fill-opacity=".45"/>
    <rect width="640" height="420" rx="14" fill="#fff"/>

    <!-- Header row -->
    <path d="M0 14a14 14 0 0 1 14-14h612a14 14 0 0 1 14 14v38H0z" fill="#1f3a93"/>
    <g fill="#fff" fill-opacity=".9">
      <rect x="24" y="21" width="34" height="10" rx="5"/>
      <rect x="92" y="21" width="52" height="10" rx="5"/>
      <rect x="196" y="21" width="96" height="10" rx="5"/>
      <rect x="430" y="21" width="58" height="10" rx="5"/>
      <rect x="536" y="21" width="50" height="10" rx="5"/>
    </g>

    <!-- Column and row lines -->
    <g stroke="#e3e6eb" stroke-width="1">
      <path d="M76 52v368M180 52v368M414 52v368M520 52v368"/>
      <path d="M0 113h640M0 174h640M0 235h640M0 296h640M0 357h640"/>
    </g>

    <!-- Rows: number, date, task and description, hours, status -->
    <g fill="#c9cfda">
      <rect x="28" y="77" width="22" height="9" rx="4.5"/>
      <rect x="28" y="138" width="22" height="9" rx="4.5"/>
      <rect x="28" y="199" width="22" height="9" rx="4.5"/>
      <rect x="28" y="260" width="22" height="9" rx="4.5"/>
      <rect x="28" y="321" width="22" height="9" rx="4.5"/>
      <rect x="28" y="382" width="22" height="9" rx="4.5"/>

      <rect x="94" y="77" width="64" height="9" rx="4.5"/>
      <rect x="94" y="138" width="64" height="9" rx="4.5"/>
      <rect x="94" y="199" width="64" height="9" rx="4.5"/>
      <rect x="94" y="260" width="64" height="9" rx="4.5"/>
      <rect x="94" y="321" width="64" height="9" rx="4.5"/>
      <rect x="94" y="382" width="64" height="9" rx="4.5"/>

      <rect x="432" y="77" width="46" height="9" rx="4.5"/>
      <rect x="432" y="138" width="38" height="9" rx="4.5"/>
      <rect x="432" y="199" width="50" height="9" rx="4.5"/>
      <rect x="432" y="260" width="42" height="9" rx="4.5"/>
