    <g fill="#1c2230">
      <rect x="198" y="70" width="150" height="10" rx="5"/>
      <rect x="198" y="131" width="118" height="10" rx="5"/>
      <rect x="198" y="192" width="172" height="10" rx="5"/>
      <rect x="198" y="253" width="132" height="10" rx="5"/>
      <rect x="198" y="314" width="160" height="10" rx="5"/>
      <rect x="198" y="375" width="104" height="10" rx="5"/>
    </g>
    <g fill="#c9cfda">
      <rect x="198" y="88" width="192" height="8" rx="4"/>
      <rect x="198" y="149" width="160" height="8" rx="4"/>
      <rect x="198" y="210" width="184" height="8" rx="4"/>
      <rect x="198" y="271" width="148" height="8" rx="4"/>
      <rect x="198" y="332" width="176" height="8" rx="4"/>
